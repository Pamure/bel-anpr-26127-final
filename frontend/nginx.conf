server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve video files directly
    location /videos/ {
        alias /usr/share/nginx/html/videos/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health endpoint direct to backend (must come before SPA routing)
    location = /health {
        proxy_pass http://backend:8088/health;
    }

    # SPA routing with no-cache for index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # API proxy to backend (inside docker network: http://backend:8088)
    location /api/ {
        proxy_pass http://backend:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # MJPEG streaming support
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}