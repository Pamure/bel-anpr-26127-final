version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bel-prototype-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bel_anpr}
      POSTGRES_USER: ${POSTGRES_USER:-anpr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anpr_user} -d ${POSTGRES_DB:-bel_anpr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bel-prototype-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-anpr_user}:${POSTGRES_PASSWORD:-secure_password_change_me}@postgres:5432/${POSTGRES_DB:-bel_anpr}
      - API_KEY=${API_KEY:-bel-anpr-2026-secret-key-change-in-production}
      - OSRM_BASE_URL=http://host.docker.internal:5000
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bel-prototype-frontend
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - backend

volumes:
  postgres_data: